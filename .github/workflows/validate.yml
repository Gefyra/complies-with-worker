name: Validate FHIR Profile
run-name: "Validate ${{ github.event.client_payload.canonical }}"

on:
  repository_dispatch:
    types: [validate]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.client_payload.hash }}
  cancel-in-progress: false

env:
  # Published CLI version (https://www.npmjs.com/package/@gefyra/complies-with-eu).
  CLI_VERSION: 2.1.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Payload values come from users of the web UI. They are passed to the shell
    # only through environment variables, never via ${{ }} inside run scripts,
    # to rule out shell injection.
    env:
      PAYLOAD_HASH: ${{ github.event.client_payload.hash }}
      PAYLOAD_PACKAGE: ${{ github.event.client_payload.package }}
      PAYLOAD_CANONICAL: ${{ github.event.client_payload.canonical }}
      PAYLOAD_EU_PROFILES: ${{ github.event.client_payload.euProfiles }}
      PAYLOAD_CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}

    steps:
      - name: Check payload
        run: |
          url_re='^https?://[A-Za-z0-9._~:/?#@!&+,=%-]+$'
          [[ "$PAYLOAD_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::invalid hash"; exit 1; }
          [[ "$PAYLOAD_PACKAGE" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid package"; exit 1; }
          [[ "$PAYLOAD_CANONICAL" =~ $url_re ]] || { echo "::error::invalid canonical"; exit 1; }
          for v in "$PAYLOAD_HASH" "$PAYLOAD_PACKAGE" "$PAYLOAD_CANONICAL" "$PAYLOAD_EU_PROFILES" "$PAYLOAD_CALLBACK_URL"; do
            [[ "$v" != *[[:cntrl:]]* ]] || { echo "::error::control characters in payload"; exit 1; }
          done
          IFS=',' read -ra profiles <<< "$PAYLOAD_EU_PROFILES"
          [ "${#profiles[@]}" -gt 0 ] || { echo "::error::no EU profiles"; exit 1; }
          for p in "${profiles[@]}"; do
            [[ "$p" =~ $url_re ]] || { echo "::error::invalid EU profile"; exit 1; }
          done
          [[ "$PAYLOAD_CALLBACK_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/api/callback$ ]] || { echo "::error::invalid callback URL"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ github.event.client_payload.package }}
          restore-keys: fhir-packages-

      - name: Cache tools (validator CLI jar, fhir-pkg-tool)
        uses: actions/cache@v6
        with:
          path: ~/.complies-with-eu/tools
          key: tools-${{ env.CLI_VERSION }}
          restore-keys: tools-

      - name: Install complies-with-eu
        run: npm install -g "@gefyra/complies-with-eu@${CLI_VERSION}"

      # stderr of the CLI steps is also kept in /tmp/cli-stderr.log so that the
      # failure callback can pass the real error message on to the web UI.
      - name: Init (download tools and EU packages)
        run: complies-with-eu init 2> >(tee -a /tmp/cli-stderr.log >&2)

      - name: Run validation
        run: |
          complies-with-eu validate "$PAYLOAD_PACKAGE" "$PAYLOAD_CANONICAL" \
            --eu-profiles "$PAYLOAD_EU_PROFILES" \
            --json \
            --output /tmp/result.json \
            2> >(tee -a /tmp/cli-stderr.log >&2)

      - name: POST result to callback
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          jq -n --arg hash "$PAYLOAD_HASH" --slurpfile result /tmp/result.json \
            '{hash: $hash, result: $result[0]}' > /tmp/callback.json
          curl -fsS -X POST "$PAYLOAD_CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            --data-binary @/tmp/callback.json

      - name: POST failure to callback
        if: failure()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          # Never send the callback secret to a URL that failed the payload check.
          if [[ ! "$PAYLOAD_CALLBACK_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/api/callback$ ]] || [[ ! "$PAYLOAD_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::warning::Skipping failure callback: invalid callback URL or hash"
            exit 0
          fi
          strip_ansi() { sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//'; }

          # Error message: everything from the last "Error:" line the CLI printed,
          # otherwise the last lines of its stderr. Runner-local paths are dropped.
          msg=""
          if [ -s /tmp/cli-stderr.log ]; then
            clean=$(strip_ansi < /tmp/cli-stderr.log || true)
            msg=$(printf '%s\n' "$clean" | awk '/^Error:/{buf=""; on=1} on{buf=buf $0 "\n"} END{printf "%s", buf}' || true)
            [ -n "$msg" ] || msg=$(printf '%s\n' "$clean" | grep -v '^[[:space:]]*$' | tail -n 15 || true)
            msg=$(printf '%s\n' "$msg" | grep -v '^Full fhir-pkg-tool output:' || true)
          fi
          [ -n "$msg" ] || msg="Validation job failed before the validator produced any output."

          # Details: the fhir-pkg-tool log, but only if that tool caused the failure
          # (the file always holds the output of its last run, successful or not).
          details=""
          pkg_log="$HOME/.complies-with-eu/logs/fhir-pkg-tool.log"
          if [[ "$msg" == *fhir-pkg-tool* || "$msg" == *"FHIR package registry"* ]] && [ -s "$pkg_log" ]; then
            details=$(strip_ansi < "$pkg_log" | grep -v '^[[:space:]]*at ' | tail -n 80 | tail -c 6000 || true)
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg hash "$PAYLOAD_HASH" --arg error "${msg:0:2000}" --arg details "$details" --arg runUrl "$run_url" \
            '{hash: $hash, error: $error, runUrl: $runUrl} + (if $details != "" then {details: $details} else {} end)' > /tmp/callback.json
          curl -fsS -X POST "$PAYLOAD_CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            --data-binary @/tmp/callback.json
