name: Build EU Profile Index

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:        # manual trigger

permissions:
  contents: read

env:
  # Published CLI version (https://www.npmjs.com/package/@gefyra/complies-with-eu).
  CLI_VERSION: 2.0.1

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # CLI_PAT is only needed to push the index to complies-with-eu-web.
      - name: Checkout complies-with-eu-web
        uses: actions/checkout@v7
        with:
          repository: Gefyra/complies-with-eu-web
          token: ${{ secrets.CLI_PAT }}
          path: web

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-eu-index-v1
          restore-keys: fhir-packages-

      - name: Install complies-with-eu
        run: npm install -g "@gefyra/complies-with-eu@${CLI_VERSION}"

      - name: Init (download EU packages)
        run: complies-with-eu init

      - name: Generate eu-profiles.json index
        run: complies-with-eu build-index --output web/public/eu-profiles.json

      - name: Commit & push index
        working-directory: web
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/eu-profiles.json
          git diff --cached --quiet || git commit -m "chore: update eu-profiles.json"
          git push
